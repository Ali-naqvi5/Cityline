<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  width="200"
  height="200"
  fill="none"
>
  <!-- Topic 2: At the airport (Terminal building with an arrow) -->
  <rect
    x="12"
    y="12"
    width="176"
    height="176"
    rx="28"
    fill="#90EE90"
    fill-opacity="0.2"
  />

  <!-- Terminal building -->
  <g transform="translate(36, 44)">
    <!-- Base tarmac line -->
    <line
      x1="4"
      y1="108"
      x2="124"
      y2="108"
      stroke="#0E6B39"
      stroke-width="2.5"
      stroke-linecap="round"
    />

    <!-- Terminal roof canopy -->
    <path
      d="M12 48 L64 36 L116 48"
      stroke="#0E6B39"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
    />
    <rect
      x="22"
      y="48"
      width="84"
      height="60"
      rx="4"
      fill="#FFFFFF"
      stroke="#0E6B39"
      stroke-width="2"
    />

    <!-- Control tower / apex feature in #90EE90 -->
    <rect
      x="54"
      y="20"
      width="20"
      height="18"
      rx="3"
      fill="#90EE90"
      stroke="#0E6B39"
      stroke-width="2"
    />
    <line x1="64" y1="10" x2="64" y2="20" stroke="#0E6B39" stroke-width="2" />

    <!-- Glass facade columns -->
    <line x1="38" y1="48" x2="38" y2="108" stroke="#DDE8DF" stroke-width="1.5" />
    <line x1="56" y1="48" x2="56" y2="108" stroke="#DDE8DF" stroke-width="1.5" />
    <line x1="72" y1="48" x2="72" y2="108" stroke="#DDE8DF" stroke-width="1.5" />
    <line x1="90" y1="48" x2="90" y2="108" stroke="#DDE8DF" stroke-width="1.5" />

    <!-- Prominent navigational directional arrow curving toward terminal -->
    <path
      d="M4 88 C4 66 24 58 46 58"
      stroke="#0E6B39"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
      stroke-dasharray="4 4"
    />
    <circle cx="108" cy="94" r="22" fill="#90EE90" stroke="#0E6B39" stroke-width="2" />
    <path
      d="M98 94 H118 M112 88 L118 94 L112 100"
      stroke="#0E6B39"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
