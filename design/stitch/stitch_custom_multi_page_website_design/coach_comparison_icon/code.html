<svg

  viewBox="0 0 140 140"
  width="140"
  height="140"
  fill="none"

  <!-- Coach Front Icon, 2px stroke #0E6B39, #90EE90 accent -->

    <line
      x1="2"
      y1="102"
      x2="78"
      y2="102"

      stroke-width="2"

    <path

    <!-- Side-view aerodynamic mirrors -->

      y="66"
      width="36"
      height="16"
      rx="4"
      stroke="#0E6B39"

    <line x1="28" y1="76" x2="52" y2="76" stroke="#0E6B39" stroke-width="1.2" />

    <!-- Headlight clusters -->
    <rect
      x="14"
      y="70"
      width="6"
      height="10"
      rx="2"
      fill="#FFFFFF"
      stroke="#0E6B39"
      stroke-width="1.5"

    <rect
      x="60"
      y="70"
      width="6"
      height="10"
      rx="2"
      fill="#FFFFFF"
      stroke="#0E6B39"
      stroke-width="1.5"

    <rect x="14" y="92" width="10" height="8" rx="2" fill="#0F1A14" />
