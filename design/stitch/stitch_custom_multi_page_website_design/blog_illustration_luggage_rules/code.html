<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 600"
  width="800"
  height="600"
  fill="none"
>
  <!-- Background -->
  <rect width="800" height="600" fill="#FAFCFA" />
  <rect
    x="20"
    y="20"
    width="760"
    height="560"
    rx="16"
    fill="#F2FBF3"
    stroke="#DDE8DF"
    stroke-width="2"
  />

  <!-- Vehicle boot dimensional bounding box -->
  <rect
    x="120"
    y="140"
    width="560"
    height="340"
    rx="16"
    fill="#FFFFFF"
    stroke="#0E6B39"
    stroke-width="3"
  />
  <line x1="120" y1="410" x2="680" y2="410" stroke="#0F1A14" stroke-width="3" />

  <!-- Caliper / measurement arrows marking capacity limits -->
  <line
    x1="120"
    y1="110"
    x2="680"
    y2="110"
    stroke="#90EE90"
    stroke-width="3"
    stroke-linecap="round"
  />
  <line x1="120" y1="100" x2="120" y2="120" stroke="#0E6B39" stroke-width="2" />
  <line x1="680" y1="100" x2="680" y2="120" stroke="#0E6B39" stroke-width="2" />
  <circle cx="400" cy="110" r="10" fill="#90EE90" stroke="#0E6B39" stroke-width="2" />

  <!-- Large check-in suitcases in boot -->
  <g transform="translate(170, 240)">
    <rect
      x="0"
      y="0"
      width="90"
      height="150"
      rx="8"
      fill="#0E6B39"
      stroke="#0F1A14"
      stroke-width="2"
    />
    <rect
      x="28"
      y="-10"
      width="34"
      height="10"
      rx="3"
      fill="#0E6B39"
      stroke="#0F1A14"
      stroke-width="1.5"
    />
    <circle cx="18" cy="155" r="5" fill="#0F1A14" />
    <circle cx="72" cy="155" r="5" fill="#0F1A14" />
  </g>
  <g transform="translate(280, 240)">
    <rect
      x="0"
      y="0"
      width="90"
      height="150"
      rx="8"
      fill="#0E6B39"
      stroke="#0F1A14"
      stroke-width="2"
    />
    <rect
      x="28"
      y="-10"
      width="34"
      height="10"
      rx="3"
      fill="#0E6B39"
      stroke="#0F1A14"
      stroke-width="1.5"
    />
    <circle cx="18" cy="155" r="5" fill="#0F1A14" />
    <circle cx="72" cy="155" r="5" fill="#0F1A14" />
  </g>

  <!-- Cabin cases stacked with green #90EE90 -->
  <g transform="translate(400, 260)">
    <rect
      x="0"
      y="0"
      width="70"
      height="110"
      rx="6"
      fill="#90EE90"
      stroke="#0E6B39"
      stroke-width="2"
    />
    <rect x="22" y="-8" width="26" height="8" rx="2" fill="#0E6B39" />
    <circle cx="14" cy="114" r="4" fill="#0F1A14" />
    <circle cx="56" cy="114" r="4" fill="#0F1A14" />
  </g>
  <g transform="translate(490, 260)">
    <rect
      x="0"
      y="0"
      width="70"
      height="110"
      rx="6"
      fill="#90EE90"
      stroke="#0E6B39"
      stroke-width="2"
    />
    <rect x="22" y="-8" width="26" height="8" rx="2" fill="#0E6B39" />
    <circle cx="14" cy="114" r="4" fill="#0F1A14" />
    <circle cx="56" cy="114" r="4" fill="#0F1A14" />
  </g>

  <!-- Tick verification badge -->
  <g transform="translate(600, 200)">
    <circle cx="0" cy="0" r="26" fill="#90EE90" stroke="#0E6B39" stroke-width="2" />
    <path
      d="M-10 0 L-3 8 L12 -8"
      stroke="#0E6B39"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
</svg>
