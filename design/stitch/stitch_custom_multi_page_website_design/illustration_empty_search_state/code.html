<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 300"
  width="400"
  height="300"
  fill="none"
>
  <!-- Empty Search State Illustration: 400x300, Family A -->
  <!-- Clean container -->
  <rect width="400" height="300" fill="none" />

  <g transform="translate(110, 40)">
    <!-- Document tilted slightly: ~ -6 deg -->
    <g transform="rotate(-6 80 110)">
      <rect
        x="20"
        y="10"
        width="120"
        height="160"
        rx="10"
        fill="#FAFCFA"
        stroke="#0E6B39"
        stroke-width="2.2"
      />
      <!-- Corner fold -->
      <path d="M100 10 V40 H140" stroke="#0E6B39" stroke-width="2" fill="none" />
      <path d="M100 10 L140 40 H100 Z" fill="#F2FBF3" />

      <!-- Three #90EE90 placeholder content bars -->
      <rect
        x="36"
        y="58"
        width="70"
        height="10"
        rx="4"
        fill="#90EE90"
        fill-opacity="0.9"
      />
      <rect
        x="36"
        y="80"
        width="88"
        height="10"
        rx="4"
        fill="#90EE90"
        fill-opacity="0.6"
      />
      <rect
        x="36"
        y="102"
        width="54"
        height="10"
        rx="4"
        fill="#90EE90"
        fill-opacity="0.4"
      />
      <!-- Subtle rule lines -->
      <line
        x1="36"
        y1="130"
        x2="104"
        y2="130"
        stroke="#DDE8DF"
        stroke-width="2"
        stroke-linecap="round"
      />
    </g>

    <!-- Magnifying glass tilted: 35 deg, hovering over the document -->
    <g transform="translate(50, 60)">
      <!-- Lens glass glow circle -->
      <circle
        cx="60"
        cy="60"
        r="42"
        fill="#F2FBF3"
        fill-opacity="0.85"
        stroke="#0E6B39"
        stroke-width="3"
      />
      <circle
        cx="60"
        cy="60"
        r="34"
        fill="none"
        stroke="#90EE90"
        stroke-width="2"
        stroke-dasharray="6 4"
      />
      <!-- Glare reflection -->
      <path
        d="M42 42 A 28 28 0 0 1 78 36"
        stroke="#FFFFFF"
        stroke-width="3.5"
        stroke-linecap="round"
      />

      <!-- Magnifier handle -->
      <line
        x1="90"
        y1="90"
        x2="134"
        y2="134"
        stroke="#0E6B39"
        stroke-width="7"
        stroke-linecap="round"
      />
      <line
        x1="92"
        y1="92"
        x2="132"
        y2="132"
        stroke="#90EE90"
        stroke-width="2.5"
        stroke-linecap="round"
      />
    </g>
  </g>
</svg>
