<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 140 140"
  width="140"
  height="140"
  fill="none"
>
  <!-- Simplified Train Carriage Front Icon, 2px stroke #0E6B39, #90EE90 accent -->
  <g transform="translate(32, 16)">
    <!-- Track rails & sleepers beneath -->
    <line
      x1="4"
      y1="104"
      x2="72"
      y2="104"
      stroke="#DDE8DF"
      stroke-width="2"
      stroke-linecap="round"
    />
    <line x1="16" y1="108" x2="24" y2="100" stroke="#0E6B39" stroke-width="2" />
    <line x1="52" y1="108" x2="60" y2="100" stroke="#0E6B39" stroke-width="2" />

    <!-- Train carriage body -->
    <path
      d="M12 28 C12 16 22 10 38 10 C54 10 64 16 64 28 L66 84 C66 90 60 94 54 94 L22 94 C16 94 10 90 10 84 Z"
      stroke="#0E6B39"
      stroke-width="2"
      fill="#F2FBF3"
      stroke-linejoin="round"
    />

    <!-- Top pantograph / roof detail -->
    <path
      d="M28 10 L38 2 L48 10"
      stroke="#0E6B39"
      stroke-width="1.5"
      stroke-linecap="round"
    />

    <!-- Front windscreen with #90EE90 accent fill -->
    <rect
      x="18"
      y="24"
      width="40"
      height="26"
      rx="6"
      fill="#90EE90"
      stroke="#0E6B39"
      stroke-width="2"
    />
    <!-- Windscreen center divider -->
    <line x1="38" y1="24" x2="38" y2="50" stroke="#0E6B39" stroke-width="1.5" />

    <!-- Front bumper / grille band -->
    <rect
      x="18"
      y="66"
      width="40"
      height="12"
      rx="3"
      stroke="#0E6B39"
      stroke-width="1.5"
      fill="#FFFFFF"
    />
    <line
      x1="24"
      y1="72"
      x2="52"
      y2="72"
      stroke="#0E6B39"
      stroke-width="1.5"
      stroke-dasharray="3 3"
    />

    <!-- Twin headlights -->
    <circle cx="20" cy="84" r="4" fill="#FFFFFF" stroke="#0E6B39" stroke-width="1.5" />
    <circle cx="56" cy="84" r="4" fill="#FFFFFF" stroke="#0E6B39" stroke-width="1.5" />
  </g>
</svg>
