<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 320 200"
  width="320"
  height="200"
  fill="none"
>
  <!-- Return Journey Prompt Illustration 320x200 Family A -->
  <!-- Delicate soft loop path in #90EE90 and connecting lines -->
  <path
    d="M 70 120 C 70 50, 160 30, 230 60 C 275 80, 275 140, 210 155 C 150 170, 95 140, 120 100"
    fill="none"
    stroke="#90EE90"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="7 5"
  />

  <!-- Return arrow indicator along curve -->
  <path
    d="M 230 60 L 222 50 M 230 60 L 218 68"
    stroke="#0E6B39"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Deep-green Pin at start/return location -->
  <g transform="translate(68, 115)">
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M0 -22 C-9 -22 -16 -15 -16 -6 C-16 6 0 20 0 20 C0 20 16 6 16 -6 C16 -15 9 -22 0 -22 Z"
      fill="#0E6B39"
    />
    <circle cx="0" cy="-6" r="6" fill="#FFFFFF" />
    <circle cx="0" cy="-6" r="3" fill="#90EE90" />
  </g>

  <!-- Aeroplane at destination airport -->
  <g transform="translate(230, 60) rotate(40)">
    <!-- Aeroplane silhouette -->
    <path
      d="M0 -18 L4 -6 L18 -1 L4 4 L4 14 L8 17 L8 19 L0 17 L-8 19 L-8 17 L-4 14 L-4 4 L-18 -1 L-4 -6 Z"
      fill="#0E6B39"
    />
    <!-- Small #90EE90 wing highlight -->
    <circle cx="0" cy="0" r="3" fill="#90EE90" />
  </g>

  <!-- Soft secondary nodes -->
  <circle cx="120" cy="100" r="4" fill="#90EE90" stroke="#0E6B39" stroke-width="1.5" />
</svg>
