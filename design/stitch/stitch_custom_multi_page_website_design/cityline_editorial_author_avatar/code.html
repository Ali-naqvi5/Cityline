<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  width="200"
  height="200"
  fill="none"
>
  <!-- Circular #F2FBF3 badge containing a simplified deep-green pen-and-route mark -->
  <circle cx="100" cy="100" r="98" fill="#F2FBF3" stroke="#DDE8DF" stroke-width="2" />
  <circle
    cx="100"
    cy="100"
    r="82"
    fill="#FFFFFF"
    stroke="#0E6B39"
    stroke-width="1.5"
    stroke-dasharray="4 3"
    opacity="0.6"
  />

  <!-- Subtle route trajectory line -->
  <path
    d="M48 135 C65 145, 90 145, 115 125 C135 108, 145 75, 154 52"
    stroke="#90EE90"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Waypoint dots on route -->
  <circle cx="56" cy="138" r="4" fill="#0E6B39" />
  <circle cx="112" cy="127" r="4" fill="#0E6B39" />

  <!-- Stylized fountain pen nib / route quill in deep-green #0E6B39 -->
  <g transform="translate(100, 95) rotate(-35) translate(-25, -45)">
    <!-- Pen nib body -->
    <path
      d="M25 5 L42 35 C45 42 42 55 38 68 L12 68 C8 55 5 42 8 35 Z"
      fill="#0E6B39"
      stroke="#0F1A14"
      stroke-width="2"
    />
    <!-- Pen nib tip point -->
    <path d="M25 0 L25 35" stroke="#F2FBF3" stroke-width="2" stroke-linecap="round" />
    <!-- Nib breather hole -->
    <circle cx="25" cy="35" r="3.5" fill="#90EE90" stroke="#0E6B39" stroke-width="1.5" />
    <!-- Nib collar -->
    <rect
      x="10"
      y="68"
      width="30"
      height="14"
      rx="2"
      fill="#1b4d2e"
      stroke="#0F1A14"
      stroke-width="1.5"
    />
  </g>
</svg>
