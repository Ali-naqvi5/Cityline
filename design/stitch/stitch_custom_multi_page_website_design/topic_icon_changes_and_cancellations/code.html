      y2="26"
      stroke="#0E6B39"
      stroke-width="3"

      y1="12"
      x2="84"
      y2="26"
      stroke="#0E6B39"

      y1="56"
      x2="44"

      y2="88"

      <circle cx="20" cy="20" r="28" fill="#90EE90" stroke="#0E6B39" stroke-width="2" />
      <!-- Circular arrow path -->
      <path
        d="M12 20 A 10 10 0 1 1 20 30"
        stroke="#0E6B39"
        stroke-width="2.5"
        stroke-linecap="round"
        fill="none"
      />
