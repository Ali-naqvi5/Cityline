<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 500"
  width="800"
  height="500"
  fill="none"
>
  <!-- Terminal Floor Background -->
  <rect width="800" height="500" fill="#FFFFFF" />
  <rect
    x="20"
    y="20"
    width="760"
    height="460"
    rx="12"
    fill="#FAFCFA"
    stroke="#DDE8DF"
    stroke-width="1.5"
  />

  <!-- Baggage Reclaim Area (Soft #F2FBF3 block) -->
  <rect
    x="50"
    y="60"
    width="280"
    height="380"
    rx="8"
    fill="#F2FBF3"
    stroke="#DDE8DF"
    stroke-width="1.5"
  />
  <text
    x="70"
    y="95"
    font-family="system-ui, sans-serif"
    font-size="13"
    font-weight="600"
    fill="#0F1A14"
    letter-spacing="0.5"
  >
    BAGGAGE RECLAIM AREA
  </text>

  <!-- Luggage Carousels (simplified geometric tracks) -->
  <rect
    x="80"
    y="130"
    width="200"
    height="60"
    rx="30"
    fill="#FFFFFF"
    stroke="#0F1A14"
    stroke-width="2"
  />
  <rect
    x="110"
    y="145"
    width="140"
    height="30"
    rx="15"
    fill="#E9F7EC"
    stroke="#0E6B39"
    stroke-width="1.5"
    stroke-dasharray="6 4"
  />

  <rect
    x="80"
    y="250"
    width="200"
    height="60"
    rx="30"
    fill="#FFFFFF"
    stroke="#0F1A14"
    stroke-width="2"
  />
  <rect
    x="110"
    y="265"
    width="140"
    height="30"
    rx="15"
    fill="#E9F7EC"
    stroke="#0E6B39"
    stroke-width="1.5"
    stroke-dasharray="6 4"
  />

  <!-- Customs / Exit corridor -->
  <path
    d="M330 180 L430 180 M330 320 L430 320"
    stroke="#0F1A14"
    stroke-width="2"
    stroke-linecap="round"
  />
  <!-- Sliding Doors symbol -->
  <line
    x1="430"
    y1="180"
    x2="430"
    y2="230"
    stroke="#0E6B39"
    stroke-width="3"
    stroke-linecap="round"
  />
  <line
    x1="430"
    y1="270"
    x2="430"
    y2="320"
    stroke="#0E6B39"
    stroke-width="3"
    stroke-linecap="round"
  />
  <text
    x="350"
    y="255"
    font-family="system-ui, sans-serif"
    font-size="11"
    font-weight="600"
    fill="#5A6E60"
    letter-spacing="0.5"
  >
    EXIT
  </text>

  <!-- Arrivals Hall (open space) -->
  <rect
    x="460"
    y="60"
    width="290"
    height="380"
    rx="8"
    fill="#FFFFFF"
    stroke="#E5EFE7"
    stroke-width="1.5"
  />
  <text
    x="490"
    y="95"
    font-family="system-ui, sans-serif"
    font-size="13"
    font-weight="600"
    fill="#0F1A14"
    letter-spacing="0.5"
  >
    PUBLIC ARRIVALS CONCOURSE
  </text>

  <!-- Information Desk / Forecourt Barricades -->
  <rect
    x="670"
    y="150"
    width="60"
    height="200"
    rx="6"
    fill="#F2FBF3"
    stroke="#DDE8DF"
    stroke-width="1.5"
  />

  <!-- Dashed Walkable Route Path from Reclaim through Exit to Marker 3 -->
  <path
    d="M180 340 L180 370 L380 370 L380 250 L560 250"
    fill="none"
    stroke="#0E6B39"
    stroke-width="3"
    stroke-dasharray="8 6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Directional arrow along path -->
  <polygon points="415,245 425,250 415,255" fill="#0E6B39" />
  <polygon points="510,245 520,250 510,255" fill="#0E6B39" />

  <!-- Step 3 Driver Meeting Point Marker (filled #90EE90 circle with '3') -->
  <circle cx="560" cy="250" r="30" fill="#90EE90" stroke="#0E6B39" stroke-width="3" />
  <circle
    cx="560"
    cy="250"
    r="38"
    fill="none"
    stroke="#0E6B39"
    stroke-width="1.5"
    stroke-dasharray="4 4"
  />
  <text
    x="560"
    y="260"
    font-family="system-ui, sans-serif"
    font-size="28"
    font-weight="800"
    fill="#0E6B39"
    text-anchor="middle"
  >
    3
  </text>

  <!-- Chauffeur Meet & Greet Callout -->
  <g transform="translate(560, 160)">
    <rect x="-85" y="0" width="170" height="36" rx="6" fill="#0E6B39" />
    <polygon points="0,42 -6,36 6,36" fill="#0E6B39" />
    <text
      x="0"
      y="23"
      font-family="system-ui, sans-serif"
      font-size="12"
      font-weight="700"
      fill="#FFFFFF"
      text-anchor="middle"
    >
      CHAUFFEUR WAITING AREA
    </text>
  </g>
</svg>
