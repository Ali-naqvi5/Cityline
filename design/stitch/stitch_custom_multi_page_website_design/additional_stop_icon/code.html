    d="M35 125 C35 85 65 60 125 45"

    stroke="#0E6B39"

  />

  <circle cx="35" cy="125" r="7" fill="#FFFFFF" stroke="#0E6B39" stroke-width="2" />
  <!-- Destination pin circle -->
  <circle cx="125" cy="45" r="7" fill="#FFFFFF" stroke="#0E6B39" stroke-width="2" />
  <!-- Branching additional third pin with #90EE90 fill accent -->
  <circle cx="115" cy="115" r="9" fill="#90EE90" stroke="#0E6B39" stroke-width="2" />
  <circle cx="115" cy="115" r="3" fill="#0E6B39" />
</svg>
