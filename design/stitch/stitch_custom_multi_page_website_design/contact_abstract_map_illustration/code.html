<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 500"
  width="800"
  height="500"
  fill="none"
>
  <!-- Stylised flat street map: roads as #DDE8DF bands, green space as #F2FBF3 blocks, water as #90EE90 at low opacity, with a single deep-green map pin. Abstract - no street names, no recognisable geography. -->
  <rect width="800" height="500" fill="#FAFCFA" />

  <!-- Green Space blocks (#F2FBF3) -->
  <rect
    x="40"
    y="40"
    width="220"
    height="150"
    rx="12"
    fill="#F2FBF3"
    stroke="#E2EBE4"
    stroke-width="1"
  />
  <rect
    x="520"
    y="50"
    width="230"
    height="130"
    rx="16"
    fill="#F2FBF3"
    stroke="#E2EBE4"
    stroke-width="1"
  />
  <rect
    x="60"
    y="270"
    width="190"
    height="180"
    rx="14"
    fill="#F2FBF3"
    stroke="#E2EBE4"
    stroke-width="1"
  />
  <rect
    x="480"
    y="320"
    width="270"
    height="140"
    rx="12"
    fill="#F2FBF3"
    stroke="#E2EBE4"
    stroke-width="1"
  />
  <rect
    x="290"
    y="80"
    width="180"
    height="80"
    rx="10"
    fill="#F2FBF3"
    stroke="#E2EBE4"
    stroke-width="1"
  />

  <!-- Waterway curving across bottom corner (#90EE90 at low opacity) -->
  <path
    d="M0 430 C 180 430, 240 480, 400 480 C 580 480, 680 440, 800 460 L800 500 L0 500 Z"
    fill="#90EE90"
    fill-opacity="0.3"
  />
  <path
    d="M0 430 C 180 430, 240 480, 400 480 C 580 480, 680 440, 800 460"
    stroke="#0E6B39"
    stroke-opacity="0.25"
    stroke-width="2"
    fill="none"
  />

  <!-- Minor Secondary Roads (#FAFCFA with #DDE8DF outlines) -->
  <line
    x1="0"
    y1="120"
    x2="800"
    y2="120"
    stroke="#DDE8DF"
    stroke-width="16"
    stroke-linecap="square"
  />
  <line
    x1="0"
    y1="120"
    x2="800"
    y2="120"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linecap="square"
  />

  <line
    x1="150"
    y1="0"
    x2="150"
    y2="500"
    stroke="#DDE8DF"
    stroke-width="16"
    stroke-linecap="square"
  />
  <line
    x1="150"
    y1="0"
    x2="150"
    y2="500"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linecap="square"
  />

  <line
    x1="620"
    y1="0"
    x2="620"
    y2="500"
    stroke="#DDE8DF"
    stroke-width="16"
    stroke-linecap="square"
  />
  <line
    x1="620"
    y1="0"
    x2="620"
    y2="500"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linecap="square"
  />

  <line
    x1="0"
    y1="360"
    x2="800"
    y2="360"
    stroke="#DDE8DF"
    stroke-width="16"
    stroke-linecap="square"
  />
  <line
    x1="0"
    y1="360"
    x2="800"
    y2="360"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linecap="square"
  />

  <!-- Major Arterial Avenue (#DDE8DF wide band crossing diagonally) -->
  <path d="M 50 500 L 750 0" stroke="#DDE8DF" stroke-width="32" stroke-linecap="square" />
  <path d="M 50 500 L 750 0" stroke="#FFFFFF" stroke-width="22" stroke-linecap="square" />
  <path
    d="M 50 500 L 750 0"
    stroke="#DDE8DF"
    stroke-width="1.5"
    stroke-dasharray="8 8"
    stroke-linecap="round"
  />

  <!-- Secondary cross diagonal -->
  <path
    d="M 120 180 L 680 340"
    stroke="#DDE8DF"
    stroke-width="22"
    stroke-linecap="square"
  />
  <path
    d="M 120 180 L 680 340"
    stroke="#FFFFFF"
    stroke-width="14"
    stroke-linecap="square"
  />

  <!-- Roundabout / Junction at center (near (400, 250)) -->
  <circle cx="400" cy="250" r="38" fill="#FFFFFF" stroke="#DDE8DF" stroke-width="14" />
  <circle cx="400" cy="250" r="22" fill="#F2FBF3" stroke="#DDE8DF" stroke-width="2" />

  <!-- Additional buildings / geometric blocks in #FFFFFF with thin border -->
  <rect
    x="290"
    y="180"
    width="80"
    height="50"
    rx="4"
    fill="#FFFFFF"
    stroke="#E2EBE4"
    stroke-width="1"
  />
  <rect
    x="430"
    y="170"
    width="70"
    height="55"
    rx="4"
    fill="#FFFFFF"
    stroke="#E2EBE4"
    stroke-width="1"
  />
  <rect
    x="330"
    y="295"
    width="85"
    height="45"
    rx="4"
    fill="#FFFFFF"
    stroke="#E2EBE4"
    stroke-width="1"
  />
  <rect
    x="440"
    y="295"
    width="75"
    height="50"
    rx="4"
    fill="#FFFFFF"
    stroke="#E2EBE4"
    stroke-width="1"
  />

  <!-- Single Deep-Green Map Pin marking Registered Office at (400, 250) -->
  <g transform="translate(400, 240)">
    <!-- Pin shadow ellipse -->
    <ellipse cx="0" cy="6" rx="14" ry="5" fill="#0F1A14" fill-opacity="0.15" />

    <!-- Outer pulse ripple in #90EE90 -->
    <circle cx="0" cy="-28" r="32" fill="#90EE90" fill-opacity="0.35" />

    <!-- Map Pin shape in deep green #0E6B39 -->
    <path
      d="M 0 0 C -14 -16, -18 -26, -18 -36 C -18 -48, -10 -56, 0 -56 C 10 -56, 18 -48, 18 -36 C 18 -26, 14 -16, 0 0 Z"
      fill="#0E6B39"
      stroke="#FFFFFF"
      stroke-width="2.5"
      filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.25))"
    />

    <!-- Inner pin circle in #90EE90 -->
    <circle cx="0" cy="-36" r="7.5" fill="#90EE90" />
    <circle cx="0" cy="-36" r="3" fill="#0E6B39" />
  </g>
</svg>
