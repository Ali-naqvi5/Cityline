<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 160"
  width="480"
  height="160"
  fill="none"
>
  <!-- Credentials icon set: three 160x160 icons, Family A: 2px #0E6B39 stroke, one #90EE90 accent each -->

  <!-- Icon 1: Licence card with a check (TfL Licencing) -->
  <g transform="translate(0, 0)">
    <!-- Card body -->
    <rect
      x="36"
      y="44"
      width="88"
      height="72"
      rx="8"
      stroke="#0E6B39"
      stroke-width="2"
      fill="#FFFFFF"
    />
    <!-- Photo badge box with #90EE90 accent fill -->
    <rect
      x="48"
      y="58"
      width="22"
      height="26"
      rx="4"
      fill="#90EE90"
      stroke="#0E6B39"
      stroke-width="1.5"
    />
    <circle cx="59" cy="68" r="4" fill="#0E6B39" />
    <path
      d="M51 80 C51 76 54 74 59 74 C64 74 67 76 67 80"
      stroke="#0E6B39"
      stroke-width="1.5"
      fill="none"
    />
    <!-- ID Lines -->
    <line
      x1="78"
      y1="62"
      x2="112"
      y2="62"
      stroke="#0E6B39"
      stroke-width="2"
      stroke-linecap="round"
    />
    <line
      x1="78"
      y1="72"
      x2="104"
      y2="72"
      stroke="#DDE8DF"
      stroke-width="2"
      stroke-linecap="round"
    />
    <line
      x1="78"
      y1="82"
      x2="110"
      y2="82"
      stroke="#DDE8DF"
      stroke-width="2"
      stroke-linecap="round"
    />
    <!-- Checkmark badge in bottom corner -->
    <circle cx="106" cy="100" r="12" fill="#0E6B39" />
    <path
      d="M101 100 L104 103 L111 96"
      stroke="#90EE90"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Icon 2: Shield with a ribbon (Comprehensive Commercial Insurance) -->
  <g transform="translate(160, 0)">
    <!-- Shield contour -->
    <path
      d="M80 34 C100 34 114 42 114 56 C114 88 80 114 80 114 C80 114 46 88 46 56 C46 42 60 34 80 34 Z"
      stroke="#0E6B39"
      stroke-width="2"
      fill="#FFFFFF"
    />
    <!-- Shield inner inlay with #90EE90 accent -->
    <path
      d="M80 44 C94 44 104 50 104 60 C104 84 80 102 80 102 C80 102 56 84 56 60 C56 50 66 44 80 44 Z"
      fill="#90EE90"
      fill-opacity="0.35"
      stroke="#0E6B39"
      stroke-width="1.5"
    />
    <!-- Ribbon detail / rosette center -->
    <circle cx="80" cy="70" r="14" fill="#0E6B39" />
    <path
      d="M75 70 L78 73 L85 66"
      stroke="#90EE90"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Hanging ribbon tails -->
    <path d="M73 82 L70 96 L77 93 L80 84" fill="#0E6B39" />
    <path d="M87 82 L90 96 L83 93 L80 84" fill="#0E6B39" />
  </g>

  <!-- Icon 3: Document with a magnifying glass (Enhanced DBS Checks) -->
  <g transform="translate(320, 0)">
    <!-- Document background -->
    <rect
      x="42"
      y="34"
      width="70"
      height="92"
      rx="6"
      stroke="#0E6B39"
      stroke-width="2"
      fill="#FFFFFF"
    />
    <line
      x1="54"
      y1="52"
      x2="84"
      y2="52"
      stroke="#0E6B39"
      stroke-width="2"
      stroke-linecap="round"
    />
    <line
      x1="54"
      y1="66"
      x2="100"
      y2="66"
      stroke="#DDE8DF"
      stroke-width="2"
      stroke-linecap="round"
    />
    <line
      x1="54"
      y1="80"
      x2="80"
      y2="80"
      stroke="#DDE8DF"
      stroke-width="2"
      stroke-linecap="round"
    />
    <line
      x1="54"
      y1="94"
      x2="94"
      y2="94"
      stroke="#DDE8DF"
      stroke-width="2"
      stroke-linecap="round"
    />
    <line
      x1="54"
      y1="108"
      x2="76"
      y2="108"
      stroke="#DDE8DF"
      stroke-width="2"
      stroke-linecap="round"
    />
    <!-- Magnifying glass with #90EE90 accent lens -->
    <g transform="translate(20, 10)">
      <circle
        cx="82"
        cy="78"
        r="18"
        fill="#90EE90"
        fill-opacity="0.45"
        stroke="#0E6B39"
        stroke-width="2"
      />
      <circle
        cx="82"
        cy="78"
        r="9"
        stroke="#0E6B39"
        stroke-width="1.5"
        stroke-dasharray="2 2"
      />
      <!-- Check in lens -->
      <path
        d="M78 78 L81 81 L87 75"
        stroke="#0E6B39"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Handle -->
      <line
        x1="95"
        y1="91"
        x2="109"
        y2="105"
        stroke="#0E6B39"
        stroke-width="3.5"
        stroke-linecap="round"
      />
    </g>
  </g>
</svg>
