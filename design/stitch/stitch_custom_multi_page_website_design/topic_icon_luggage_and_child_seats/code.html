<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  width="200"
  height="200"
  fill="none"
>
  <!-- Topic 3: Luggage and child seats (Suitcase beside a child seat) -->
  <rect
    x="12"
    y="12"
    width="176"
    height="176"
    rx="28"
    fill="#90EE90"
    fill-opacity="0.2"
  />

  <g transform="translate(30, 42)">
    <!-- Ground baseline -->
    <line
      x1="6"
      y1="112"
      x2="134"
      y2="112"
      stroke="#0E6B39"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- Suitcase (Left) -->
    <rect
      x="12"
      y="34"
      width="56"
      height="74"
      rx="8"
      stroke="#0E6B39"
      stroke-width="2.5"
      fill="#FFFFFF"
    />
    <!-- Handle -->
    <path
      d="M30 34 V22 Q30 18 36 18 H44 Q50 18 50 22 V34"
      stroke="#0E6B39"
      stroke-width="2"
      fill="none"
    />
    <!-- Suitcase ribbing lines -->
    <line x1="20" y1="56" x2="60" y2="56" stroke="#DDE8DF" stroke-width="2" />
    <line x1="20" y1="74" x2="60" y2="74" stroke="#DDE8DF" stroke-width="2" />
    <!-- Wheels -->
    <circle cx="24" cy="110" r="4" fill="#0E6B39" />
    <circle cx="56" cy="110" r="4" fill="#0E6B39" />

    <!-- Child Safety Seat (Right) -->
    <!-- Seat shell -->
    <path
      d="M80 108 L126 108 C128 108 130 106 130 103 L126 78 C126 74 122 70 118 70 L118 42 C118 34 112 28 104 28 C96 28 92 34 92 42 L92 72 L82 72 C78 72 76 76 76 80 L76 104 C76 106 78 108 80 108 Z"
      stroke="#0E6B39"
      stroke-width="2.2"
      fill="#F2FBF3"
      stroke-linejoin="round"
    />

    <!-- Headrest cushion in #90EE90 -->
    <rect
      x="94"
      y="32"
      width="20"
      height="24"
      rx="6"
      fill="#90EE90"
      stroke="#0E6B39"
      stroke-width="1.8"
    />
    <!-- 5-point safety harness straps -->
    <line x1="100" y1="58" x2="98" y2="88" stroke="#0E6B39" stroke-width="2" />
    <line x1="108" y1="58" x2="110" y2="88" stroke="#0E6B39" stroke-width="2" />
    <circle cx="104" cy="88" r="4" fill="#90EE90" stroke="#0E6B39" stroke-width="1.5" />
  </g>
</svg>
