<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 300"
  width="400"
  height="300"
  fill="none"
>
  <!-- Subtle circular soft glow backdrop -->
  <circle cx="200" cy="150" r="110" fill="#E8F8EC" />

  <!-- Abstract confirmation ticket / voucher angled behind -->
  <rect
    x="85"
    y="65"
    width="210"
    height="150"
    rx="8"
    fill="#FFFFFF"
    stroke="#DDE8DF"
    stroke-width="1.5"
    transform="rotate(-4 190 140)"
  />

  <!-- Main printed booking confirmation card (front) -->
  <g transform="translate(100, 50)">
    <!-- Card Base -->
    <rect
      x="0"
      y="0"
      width="200"
      height="155"
      rx="8"
      fill="#FFFFFF"
      stroke="#0E6B39"
      stroke-width="2"
    />

    <!-- Top Brand Accent Header Strip -->
    <rect x="0" y="0" width="200" height="16" rx="8" fill="#0E6B39" />
    <rect x="0" y="8" width="200" height="8" fill="#0E6B39" />

    <!-- Subtle simulated header line -->
    <rect x="18" y="32" width="70" height="7" rx="3.5" fill="#0E6B39" />
    <rect x="18" y="44" width="45" height="4" rx="2" fill="#DDE8DF" />

    <!-- Reference Area Box with #90EE90 abstract bars -->
    <rect
      x="18"
      y="62"
      width="164"
      height="36"
      rx="5"
      fill="#F2FBF3"
      stroke="#DDE8DF"
      stroke-width="1"
    />
    <!-- Three abstract #90EE90 reference bars representing booking ref -->
    <rect x="30" y="75" width="38" height="10" rx="4" fill="#90EE90" />
    <rect x="76" y="75" width="48" height="10" rx="4" fill="#90EE90" />
    <rect x="132" y="75" width="38" height="10" rx="4" fill="#90EE90" />

    <!-- Mock detail rows -->
    <line x1="18" y1="114" x2="182" y2="114" stroke="#EEF4F0" stroke-width="1.5" />
    <circle cx="24" cy="128" r="4" fill="#90EE90" stroke="#0E6B39" stroke-width="1.5" />
    <rect x="36" y="126" width="60" height="5" rx="2.5" fill="#B7D3BE" />
    <circle cx="110" cy="128" r="4" fill="#FFFFFF" stroke="#0E6B39" stroke-width="1.5" />
    <rect x="122" y="126" width="50" height="5" rx="2.5" fill="#B7D3BE" />
  </g>

  <!-- Magnifying glass examining the reference area -->
  <g transform="translate(195, 105)">
    <!-- Drop shadow for glass lens -->
    <circle cx="48" cy="48" r="42" fill="#0E6B39" fill-opacity="0.06" />

    <!-- Heavy Magnifying Glass Handle -->
    <line
      x1="80"
      y1="80"
      x2="135"
      y2="135"
      stroke="#0E6B39"
      stroke-width="12"
      stroke-linecap="round"
    />
    <line
      x1="80"
      y1="80"
      x2="135"
      y2="135"
      stroke="#90EE90"
      stroke-width="5"
      stroke-linecap="round"
    />
    <rect
      x="74"
      y="72"
      width="12"
      height="12"
      rx="2"
      fill="#0E6B39"
      transform="rotate(45 80 78)"
    />

    <!-- Glass Rim -->
    <circle
      cx="46"
      cy="46"
      r="42"
      stroke="#0E6B39"
      stroke-width="5"
      fill="#F2FBF3"
      fill-opacity="0.6"
    />

    <!-- Inner magnified refraction highlight & reflection arc -->
    <path
      d="M22 30 C30 18 50 16 66 24"
      stroke="#90EE90"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <circle cx="36" cy="32" r="3" fill="#FFFFFF" />

    <!-- Magnified miniature ticket snippet inside lens -->
    <rect
      x="26"
      y="44"
      width="22"
      height="7"
      rx="3.5"
      fill="#90EE90"
      stroke="#0E6B39"
      stroke-width="1"
    />
    <rect
      x="52"
      y="44"
      width="26"
      height="7"
      rx="3.5"
      fill="#90EE90"
      stroke="#0E6B39"
      stroke-width="1"
    />
  </g>
</svg>
