  viewBox="0 0 800 600"
  width="800"
  height="600"
  fill="none"

  <rect width="800" height="600" fill="#FAFCFA" />
  <rect
    x="20"
    y="20"
    width="760"
    height="560"
    rx="16"
    fill="#F2FBF3"
    stroke="#DDE8DF"

  <!-- Car interior rear seating row silhouette -->
  <rect
    x="140"
    y="160"
    width="520"
    height="320"
    rx="20"
    fill="#FFFFFF"
    stroke="#0E6B39"
    stroke-width="2.5"
  />
  <path d="M140 380 Q400 390 660 380" stroke="#DDE8DF" stroke-width="2" />

  <!-- Child seat rear-facing silhouette (left) -->
  <g transform="translate(220, 230)">
    <path

    />

      stroke="#90EE90"
      stroke-width="4"
      stroke-linecap="round"
    />
    <rect
      x="45"
      y="80"
      width="40"
      height="35"
      rx="6"
      fill="#90EE90"
      stroke="#0E6B39"
      stroke-width="1.5"
    />
    <circle cx="65" cy="98" r="4" fill="#0E6B39" />
  </g>

  <!-- Forward-facing booster seat (right) -->
  <g transform="translate(430, 240)">
    <rect
      x="15"
      y="25"
      width="90"
      height="95"
      rx="12"

      y="10"
      width="70"
      height="25"
      rx="8"

      stroke="#0E6B39"
      stroke-width="1.5"

    <line
      x1="35"
      y1="35"
      x2="60"
      y2="85"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
    />
    <line
      x1="85"
      y1="35"
      x2="60"
      y2="85"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
    />
    <circle cx="60" cy="85" r="6" fill="#90EE90" />
    <rect x="10" y="115" width="100" height="20" rx="5" fill="#1b4d2e" />
  </g>

  <!-- Safety shield emblem overhead -->
  <g transform="translate(400, 125)">
    <path
      d="M0 -30 L22 -18 V5 C22 22 0 35 0 35 C0 35 -22 22 -22 5 V-18 Z"
      fill="#90EE90"
      stroke="#0E6B39"
      stroke-width="2.5"
    />

      d="M-8 0 L-2 6 L10 -6"
      stroke="#0E6B39"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
