<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 600"
  width="800"
  height="600"
  fill="none"
>
  <!-- Background -->
  <rect width="800" height="600" fill="#FAFCFA" />
  <rect
    x="20"
    y="20"
    width="760"
    height="560"
    rx="16"
    fill="#F2FBF3"
    stroke="#DDE8DF"
    stroke-width="2"
  />

  <!-- Ocean waterline with gentle stylized waves -->
  <path
    d="M60 440 C140 430 180 450 260 440 C340 430 380 450 460 440 C540 430 580 450 660 440 C700 435 720 440 740 440"
    stroke="#90EE90"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M60 470 C140 460 180 480 260 470 C340 460 380 480 460 470 C540 460 580 480 660 470 C700 465 720 470 740 470"
    stroke="#DDE8DF"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Quayside / pier terminal -->
  <rect
    x="100"
    y="320"
    width="220"
    height="120"
    rx="8"
    fill="#FFFFFF"
    stroke="#0E6B39"
    stroke-width="2.5"
  />
  <line x1="100" y1="360" x2="320" y2="360" stroke="#DDE8DF" stroke-width="2" />
  <circle cx="210" cy="390" r="14" fill="#90EE90" />

  <!-- Cruise liner hull & decks (Southampton / Dover seaports) -->
  <g transform="translate(320, 200)">
    <!-- Liner Hull -->
    <path
      d="M40 220 L340 220 C360 220 380 190 400 150 L20 150 C20 180 25 210 40 220 Z"
      fill="#0E6B39"
      stroke="#0F1A14"
      stroke-width="3"
    />
    <!-- Upper decks in white & #F2FBF3 -->
    <rect
      x="50"
      y="100"
      width="280"
      height="50"
      rx="6"
      fill="#FFFFFF"
      stroke="#0E6B39"
      stroke-width="2"
    />
    <rect
      x="80"
      y="60"
      width="200"
      height="40"
      rx="6"
      fill="#F2FBF3"
      stroke="#0E6B39"
      stroke-width="2"
    />
    <!-- Portholes / cabin windows row -->
    <circle cx="90" cy="125" r="5" fill="#90EE90" />
    <circle cx="130" cy="125" r="5" fill="#90EE90" />
    <circle cx="170" cy="125" r="5" fill="#90EE90" />
    <circle cx="210" cy="125" r="5" fill="#90EE90" />
    <circle cx="250" cy="125" r="5" fill="#90EE90" />
    <circle cx="290" cy="125" r="5" fill="#90EE90" />
    <!-- Funnel in deep green with #90EE90 band -->
    <path
      d="M190 20 L215 20 L220 60 L185 60 Z"
      fill="#0E6B39"
      stroke="#0F1A14"
      stroke-width="2"
    />
    <rect x="187" y="32" width="30" height="8" fill="#90EE90" />
  </g>

  <!-- Direct route transfer indicator -->
  <g transform="translate(180, 260)">
    <circle cx="0" cy="0" r="24" fill="#90EE90" stroke="#0E6B39" stroke-width="2" />
    <path
      d="M-8 0 L8 0 M2 -6 L8 0 L2 6"
      stroke="#0E6B39"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
