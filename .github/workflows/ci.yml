name: CI

on:
  pull_request:
  # Called by deploy.yml on a push to main, so the same checks gate the
  # deployment instead of running beside it. Not triggered on push directly,
  # or every main push would run these twice.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` — it comes from `packageManager` in package.json, and
      # the action fails if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: TfL wording check (CMP-01)
        run: pnpm check:compliance

      - name: Migrations only add (DATA-04)
        run: pnpm check:migrations

      - name: Unit tests (pricing, money, compliance)
        run: pnpm test

  # The booking funnel in a real browser, at 390px and 1440px (NFR-07, PRD-06).
  # It stops at the card form: see e2e/booking.spec.ts for why payment itself
  # is not driven from CI.
  e2e:
    name: Booking flow (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cityline
          POSTGRES_PASSWORD: cityline
          POSTGRES_DB: cityline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cityline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for a throwaway database; the same ones the
      # Playwright web server uses (playwright.config.ts).
      DATABASE_URL: postgres://cityline:cityline@127.0.0.1:5432/cityline
      E2E_DATABASE_URL: postgres://cityline:cityline@127.0.0.1:5432/cityline
      PAYLOAD_SECRET: e2e-secret-e2e-secret-e2e-secret-abc
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      PREVIEW_TOKEN: e2e-preview-token
      CRON_SECRET: e2e-cron-secret
    steps:
      - uses: actions/checkout@v4

      # No `version:` — it comes from `packageManager` in package.json, and
      # the action fails if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Migrate the database
        run: pnpm migrate

      - name: Booking flow and launch gate
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
